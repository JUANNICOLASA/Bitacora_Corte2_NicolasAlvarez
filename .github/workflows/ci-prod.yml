name: CD - Deploy PROD

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/blue-velvet-api

jobs:
  build-prod:
    name: Build imagen PROD
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn test --no-transfer-progress

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata con el tag de version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build y push imagen de produccion
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-prod:
    name: Desplegar a PROD
    needs: build-prod
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://blue-velvet-prod-jnam.azurewebsites.net/swagger-ui/index.html
    steps:
      - name: Login a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar variables de entorno en Azure PROD
        run: |
          az webapp config appsettings set --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME_PROD }} --output none --settings \
            SPRING_PROFILES_ACTIVE=docker WEBSITES_PORT=8080 \
            DB_URL="${{ secrets.DB_URL_PROD }}" \
            DB_USERNAME="${{ secrets.DB_USERNAME_PROD }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD_PROD }}" \
            MONGO_URI="${{ secrets.MONGO_URI_PROD }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET_PROD }}" \
            USUARIOS_PASSWORD="${{ secrets.USUARIOS_PASSWORD_PROD }}"

      - name: Desplegar en Azure Web App (PROD)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          images: ${{ env.IMAGE_NAME }}:${{ needs.build-prod.outputs.version }}

  notify:
    name: Resumen del despliegue
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Resumen
        run: |
          echo "PROD desplegado correctamente"
          echo "Version: ${{ github.ref_name }}"
          echo "URL: https://${{ secrets.AZURE_WEBAPP_NAME_PROD }}.azurewebsites.net"
