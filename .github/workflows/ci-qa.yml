# S10 - CI/CD con GitHub Actions. Workflow = este archivo .yml dentro de .github/workflows
# Events (on): push a master/develop o pull request a master.
# Jobs: test -> build-and-push -> deploy-qa (needs define el orden). Steps = pasos dentro de cada job.
# Actions (uses:) = scripts reutilizables.
# CI: compila y corre las pruebas en cada commit. CD: publica la imagen en Docker Hub y despliega a QA en Azure.
# S08 - Ramas: develop = integracion, master = version estable.
name: CI - Build, Test y Deploy QA

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/blue-velvet-api

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn test --no-transfer-progress

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

  build-and-push:
    name: Build imagen Docker
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Secrets: ${{ secrets.NOMBRE }}, se guardan en Settings -> Secrets and variables -> Actions.
      # Nunca en el codigo, en la imagen ni impresos en los logs.
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=qa-
            type=raw,value=qa-latest

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: Desplegar a QA
    needs: build-and-push
    runs-on: ubuntu-latest
    # Ambiente QA: homologo a produccion en configuracion, es donde prueba el tester
    environment:
      name: qa
      url: https://blue-velvet-qa-jnam.azurewebsites.net/swagger-ui/index.html
    steps:
      - name: Login a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar variables de entorno en Azure QA
        run: |
          az webapp config appsettings set --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME_QA }} --output none --settings \
            SPRING_PROFILES_ACTIVE=docker WEBSITES_PORT=8080 \
            DB_URL="${{ secrets.DB_URL_QA }}" \
            DB_USERNAME="${{ secrets.DB_USERNAME_QA }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD_QA }}" \
            MONGO_URI="${{ secrets.MONGO_URI_QA }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET_QA }}" \
            USUARIOS_PASSWORD="${{ secrets.USUARIOS_PASSWORD_QA }}"

      - name: Desplegar en Azure Web App (QA)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          images: ${{ env.IMAGE_NAME }}:qa-latest
