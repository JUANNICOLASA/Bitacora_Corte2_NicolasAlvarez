# S10 - Perfil docker: en docker-compose los hosts son los nombres de los servicios (postgres, mongo).
# En Azure estos valores llegan como App Settings (variables de entorno).
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/blue_velvet}
spring.data.mongodb.uri=${MONGO_URI:mongodb://mongo:27017/blue_velvet}
spring.jpa.show-sql=false
logging.level.com.restaurante=INFO
