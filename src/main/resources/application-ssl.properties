# S10 - SSL/TLS (HTTPS): cifra la comunicacion (confidencialidad + integridad, evita man-in-the-middle).
# El certificado va en un keystore .p12 que NO se sube al repo. Se activa con el perfil ssl.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:classpath:blue-velvet.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=blue-velvet
