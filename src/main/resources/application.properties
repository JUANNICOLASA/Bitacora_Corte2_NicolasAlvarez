spring.application.name=blue-velvet-api
# S08 - Configuracion: .properties si es simple, .yml si es compleja. Perfiles por ambiente:
# application-docker, application-ssl, application-oauth2 y application-test.
# Se puede leer desde el codigo con @Value o con @ConfigurationProperties.
# Esta linea lee un .env local si existe (el .env esta en el .gitignore).
spring.config.import=optional:file:.env[.properties]
server.port=8080
# S10 - Security Misconfiguration: nunca mostrar el stacktrace al cliente
server.error.include-stacktrace=never

# S09 - PostgreSQL (relacional). ${VARIABLE:defecto} = variable de entorno con valor por defecto para local.
# S10 - Las credenciales reales nunca se suben al repositorio.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blue_velvet}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# update solo para desarrollo. Nunca create en produccion (borra y recrea las tablas),
# en produccion se usan migraciones (Flyway / Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Sin open-in-view: las relaciones LAZY se cargan dentro del service (@Transactional / @EntityGraph)
spring.jpa.open-in-view=false

# S09 - MongoDB (no relacional) para el historial de eventos. auto-index-creation crea los @Indexed
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/blue_velvet}
spring.data.mongodb.auto-index-creation=true

# S10 - Secreto del JWT (Base64) desde variable de entorno. expiration-ms = TTL del token
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
usuarios.password-inicial=${USUARIOS_PASSWORD:}
cors.origenes=${CORS_ORIGENES:http://localhost:3000,http://localhost:5173}
app.zona-horaria=America/Bogota

cocteles-externos.url=${COCTELES_EXTERNOS_URL:https://www.thecocktaildb.com/api/json/v1/1}
spring.cloud.openfeign.client.config.coctelesExternos.connect-timeout=3000
spring.cloud.openfeign.client.config.coctelesExternos.read-timeout=5000
spring.cloud.openfeign.client.config.coctelesExternos.logger-level=basic

# S08 - Swagger: contrato OpenAPI en /v3/api-docs y la UI en /swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# S08 - Logs: root es el nivel base y para el paquete com.restaurante se da mas detalle (DEBUG)
logging.level.root=INFO
logging.level.com.restaurante=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
