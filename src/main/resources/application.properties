spring.application.name=blue-velvet-api
spring.config.import=optional:file:.env[.properties]
server.port=8080
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blue_velvet}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/blue_velvet}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
usuarios.password-inicial=${USUARIOS_PASSWORD:}
cors.origenes=${CORS_ORIGENES:http://localhost:3000,http://localhost:5173}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

logging.level.root=INFO
logging.level.com.restaurante=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
