# Perfil test: H2 en memoria en modo PostgreSQL para que las pruebas no dependan de una BD real.
# Mongo se excluye y se mockea en las pruebas.
spring.application.name=blue-velvet-api-test
spring.datasource.url=jdbc:h2:mem:bluevelvet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.com.restaurante=INFO
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
jwt.secret=cHJ1ZWJhcy1ibHVlLXZlbHZldC1jbGF2ZS1kZS1maXJtYS1qd3QtMjU2LWJpdHM=
jwt.expiration-ms=60000
cors.origenes=http://localhost:3000
